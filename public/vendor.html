<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600&display=swap"><link rel="stylesheet" href="/style.css"><title>Заведение панели</title></head><body>
<div id="login" class="wrap" hidden><div class="mosaic"></div><h1 style="margin-top:24px">Заведение панели</h1><form id="login-form" class="card" style="margin-top:16px"><label for="l-phone">Телефон / логин</label><input id="l-phone" autocomplete="username"><label for="l-pass">Парол</label><input id="l-pass" type="password" autocomplete="current-password"><p class="err" id="login-err" role="alert"></p><button class="btn" type="submit">Кириш</button></form></div>
<div id="root" hidden><div class="mosaic"></div><div class="wrap">
<header><div><h1 id="vname"></h1><p class="sub" id="vinfo"></p></div><div class="actions"><button class="ghost" id="toggle"></button><button class="ghost" onclick="logout()">Чиқиш</button></div></header>
<h2>Буюртмалар</h2><div id="orders"></div>
<h2>Меню</h2>
<div class="card"><b>Янги маҳсулот</b><div class="f4"><input id="p-n" placeholder="Номи" aria-label="Номи"><input id="p-u" placeholder="1 дона" aria-label="Ўлчов"><input id="p-p" type="number" min="1" placeholder="₸" aria-label="Нарх"><button class="btn" id="p-add">+</button></div><p class="err" id="p-err" role="alert"></p></div>
<div id="products"></div>
</div></div>
<script src="/common.js"></script>
<script>
var me=null;
function wrap(fn){return async function(){try{await fn.apply(null,arguments)}catch(e){alert(e.message)}}}
async function info(){me=await api("/vendor/me");$("vname").textContent=me.emoji+" "+me.name;$("vinfo").textContent="Платформа комиссияси: "+me.commission+"%";$("toggle").textContent=me.open?"Ёпиш (буюртма олмаслик)":"Очиш";document.title=me.name}
async function orders(){var o=await api("/vendor/orders"),h="",n=0;
  o.forEach(function(x){if(x.status==="new")n++;
    h+='<div class="card"><div class="line"><b>#'+esc(x.code)+'</b><span>'+badge(x.status)+'</span></div>'+orderBody(x)+'<div class="line"><span>Маҳсулотлар '+fmt(x.subtotal)+' · '+(x.pay_method==="kaspi"?"Kaspi":"нақд")+' · '+(x.pay_status==="paid"?'<span class="ok">тўланган</span>':'тўланмаган')+'</span></div><div class="actions">'+
    (x.status==="new"?'<button class="btn" data-a="accepted" data-id="'+x.id+'">Қабул қилиш</button><button class="danger" data-a="cancelled" data-id="'+x.id+'">Бекор қилиш</button>':'')+
    (x.status==="accepted"?'<button class="btn" data-a="ready" data-id="'+x.id+'">Тайёр</button>':'')+
    (x.pay_method==="kaspi"&&x.pay_status!=="paid"&&x.status!=="cancelled"?'<button class="ghost" data-a="paid" data-id="'+x.id+'">Kaspi тўлови тушди</button>':'')+'</div></div>'});
  $("orders").innerHTML=h||'<p class="meta">Ҳали буюртма йўқ.</p>';
  document.title=(n?"("+n+") ":"")+(me?me.name:"Панел")}
async function products(){var p=await api("/vendor/products"),h="";
  p.forEach(function(x){h+='<div class="line"><span>'+esc(x.name)+' <span class="meta">'+esc(x.unit)+'</span>'+(x.available?'':' <span class="badge r">йўқ</span>')+'</span><span><input type="number" min="1" value="'+x.price+'" id="pr'+x.id+'" aria-label="Нарх" style="width:100px;display:inline-block"> <button class="ghost" data-p="price" data-id="'+x.id+'">Сақлаш</button> <button class="ghost" data-p="avail" data-id="'+x.id+'" data-v="'+(x.available?0:1)+'">'+(x.available?'Тугади':'Бор')+'</button> <button class="danger" data-p="del" data-id="'+x.id+'" aria-label="Ўчириш">×</button></span></div>'});
  $("products").innerHTML=h||'<p class="meta">Меню бўш. Юқорида маҳсулот қўшинг.</p>'}
document.addEventListener("click",wrap(async function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.a){await api("/vendor/orders/"+d.id,{method:"PATCH",body:d.a==="paid"?{pay_status:"paid"}:{status:d.a}});return orders()}
  if(d.p==="price")await api("/vendor/products/"+d.id,{method:"PATCH",body:{price:$("pr"+d.id).value}});
  if(d.p==="avail")await api("/vendor/products/"+d.id,{method:"PATCH",body:{available:+d.v}});
  if(d.p==="del"){if(!confirm("Ўчирилсинми?"))return;await api("/vendor/products/"+d.id,{method:"DELETE"})}
  if(d.p)products()}));
panel("vendor","Панел",function(){
  info().then(orders);products();setInterval(orders,10000);
  $("toggle").onclick=wrap(async function(){await api("/vendor/me",{method:"PATCH",body:{open:me.open?0:1}});info()});
  $("p-add").onclick=async function(){$("p-err").textContent="";try{await api("/vendor/products",{method:"POST",body:{name:$("p-n").value,unit:$("p-u").value,price:$("p-p").value}});["p-n","p-u","p-p"].forEach(function(i){$(i).value=""});products()}catch(x){$("p-err").textContent=x.message}};
});
</script></body></html>
